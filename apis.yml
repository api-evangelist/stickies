name: Stickies
description: >-
  Stickies (stickies.wtf) was a Los Angeles-based consumer web3 company, built
  by BYO Labs, that made "dumb stickers and GIFs starring your favorite NFTs" —
  users connected a crypto wallet holding their NFTs and generated custom
  stickers and GIFs of those avatars for use in messaging and social apps.
  Founded around 2022 by Tom Wright (CEO) and Sterling Barnett (COO), it raised
  roughly $5.5M with backing from Lightspeed Venture Partners (Jeremy Liew).
  The product was a closed consumer web app with no public developer API,
  documentation, or SDK. The company appears defunct: the stickies.wtf site
  was last captured live in 2023, returned 403s by mid-2024, and the domain no
  longer resolves (NXDOMAIN) as of July 2026; co-founder Sterling Barnett has
  since moved on to other ventures.
